[tool.poetry]
name = "handwritten-scientific-readability"
version = "0.1.0"
description = "A computational framework to quantify and evaluate the structural machine readability of handwritten scientific documents."
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
numpy = "^1.21"
pandas = "^1.3"
pytesseract = "^0.3.10"
jiwer = "^3.0.0"
scikit-learn = "^0.24"
opencv-python = "^4.5"
tensorflow = "^2.6"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"